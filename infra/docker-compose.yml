version: "3.9"

services:

  # ─────────────────────────────────────────────────────────
  # Base de données Django
  # ─────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: wiqayati_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiqayati
      POSTGRES_USER: wiqayati
      POSTGRES_PASSWORD: wiqayati_dev_2026
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiqayati -d wiqayati"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # Base de données HAPI FHIR (séparée)
  # ─────────────────────────────────────────────────────────
  hapi-fhir-db:
    image: postgres:15-alpine
    container_name: wiqayati_hapi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hapi_fhir
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi_password_2026
    volumes:
      - hapi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi_fhir"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # Serveur HAPI FHIR R4
  # ─────────────────────────────────────────────────────────
  hapi-fhir:
    image: hapiproject/hapi:v7.2.0
    container_name: wiqayati_hapi_fhir
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - ./hapi-fhir/application.yaml:/data/hapi/application.yaml:ro
      - hapi_lucene_data:/var/lib/hapi/lucenefiles
    environment:
      SPRING_CONFIG_LOCATION: file:///data/hapi/application.yaml
      JAVA_OPTS: "-Xmx2g -Xms512m"
    depends_on:
      hapi-fhir-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/fhir/metadata || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────────────────────
  # Redis (Celery broker + cache + JWT blacklist)
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wiqayati_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # Backend Django (décommenté quand le Dockerfile est prêt)
  # ─────────────────────────────────────────────────────────
  # backend:
  #   build:
  #     context: ../backend
  #     dockerfile: Dockerfile
  #   container_name: wiqayati_backend
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - DATABASE_URL=postgresql://wiqayati:wiqayati_dev_2026@db:5432/wiqayati
  #     - FHIR_SERVER_URL=http://hapi-fhir:8080/fhir
  #     - REDIS_URL=redis://redis:6379/0
  #     - DJANGO_SETTINGS_MODULE=wiqayati.settings.development
  #     - RISK_ENGINE_URL=internal://stub
  #     - SECRET_KEY=dev-secret-key-change-in-production
  #     - DEBUG=True
  #     - ALLOWED_HOSTS=localhost,127.0.0.1
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   volumes:
  #     - ../backend:/app

  # ─────────────────────────────────────────────────────────
  # Celery worker (décommenté quand le backend est prêt)
  # ─────────────────────────────────────────────────────────
  # celery-worker:
  #   build:
  #     context: ../backend
  #   container_name: wiqayati_celery
  #   command: celery -A wiqayati worker --loglevel=info --queues=fhir_sync,notifications
  #   environment:
  #     - DATABASE_URL=postgresql://wiqayati:wiqayati_dev_2026@db:5432/wiqayati
  #     - REDIS_URL=redis://redis:6379/0
  #     - FHIR_SERVER_URL=http://hapi-fhir:8080/fhir
  #     - DJANGO_SETTINGS_MODULE=wiqayati.settings.development
  #   depends_on:
  #     - backend
  #     - redis

  # ─────────────────────────────────────────────────────────
  # Celery Beat (tâches planifiées)
  # ─────────────────────────────────────────────────────────
  # celery-beat:
  #   build:
  #     context: ../backend
  #   container_name: wiqayati_celery_beat
  #   command: celery -A wiqayati beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
  #   environment:
  #     - DATABASE_URL=postgresql://wiqayati:wiqayati_dev_2026@db:5432/wiqayati
  #     - REDIS_URL=redis://redis:6379/0
  #     - DJANGO_SETTINGS_MODULE=wiqayati.settings.development
  #   depends_on:
  #     - backend
  #     - redis

volumes:
  pg_data:
    name: wiqayati_pg_data
  hapi_pg_data:
    name: wiqayati_hapi_pg_data
  hapi_lucene_data:
    name: wiqayati_hapi_lucene
  redis_data:
    name: wiqayati_redis_data
