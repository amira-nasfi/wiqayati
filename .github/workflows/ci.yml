name: CI — Wiqayati

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# ─────────────────────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────────
  # 1. Backend Django — lint + tests
  # ───────────────────────────────────────────────
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wiqayati_test
          POSTGRES_USER: wiqayati
          POSTGRES_PASSWORD: wiqayati_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: wiqayati.settings.ci
      DATABASE_URL: postgres://wiqayati:wiqayati_pass@localhost:5432/wiqayati_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/base.txt

      - name: Installer les dépendances Python
        run: pip install -r requirements/base.txt -r requirements/development.txt

      - name: Vérifier la syntaxe (Flake8)
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=migrations,__pycache__,settings

      - name: Appliquer les migrations
        run: python manage.py migrate --no-input

      - name: Lancer les tests Django
        run: |
          python manage.py test apps \
            --verbosity=2 \
            --parallel \
            --keepdb

      - name: Vérifier les migrations manquantes
        run: python manage.py makemigrations --check --dry-run

  # ───────────────────────────────────────────────
  # 2. Frontend React — lint + build
  # ───────────────────────────────────────────────
  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types TypeScript
        run: npx tsc --noEmit

      - name: Build de production
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

      - name: Vérifier la taille du bundle
        run: |
          echo "=== Taille du bundle ==="
          du -sh dist/

  # ───────────────────────────────────────────────
  # 3. Mobile Expo — type-check + export web
  # ───────────────────────────────────────────────
  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Vérifier les types TypeScript
        run: npx tsc --noEmit

      - name: Export web Expo (validation du build)
        run: npx expo export --platform web --output-dir dist
        env:
          CI: "1"

  # ───────────────────────────────────────────────
  # 4. Sécurité — audit des dépendances
  # ───────────────────────────────────────────────
  security:
    name: Audit de sécurité
    runs-on: ubuntu-latest
    # Non bloquant — continue même en cas de vulnérabilités modérées
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit frontend
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true

      - name: Audit mobile
        run: npm audit --audit-level=high
        working-directory: mobile
        continue-on-error: true

      - name: Audit Python (safety)
        run: |
          pip install safety
          safety check -r backend/requirements/base.txt --full-report
        continue-on-error: true

  # ───────────────────────────────────────────────
  # 5. Résumé CI — badge de statut global
  # ───────────────────────────────────────────────
  ci-ok:
    name: CI — OK
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile]
    if: always()

    steps:
      - name: Vérifier le statut global
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || \
                "${{ needs.frontend.result }}" != "success" || \
                "${{ needs.mobile.result }}" != "success" ]]; then
            echo "❌ Un ou plusieurs jobs ont échoué."
            exit 1
          fi
          echo "✅ Tous les jobs CI sont passés avec succès."
