name: Build Android APK (EAS)

on:
  # Déclenché manuellement depuis l'onglet "Actions" de GitHub
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - production

  # Ou automatiquement lors d'un push sur main
  push:
    branches:
      - main
    paths:
      - 'mobile/**'

jobs:
  build-apk:
    name: Build Android APK via EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK with EAS Cloud
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://wiqayati.onrender.com
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --non-interactive \
            --no-wait

      - name: Build info
        run: |
          echo "✅ Build soumis a EAS Cloud !"
          echo "Surveillez l'avancement sur: https://expo.dev/accounts/[votre-username]/projects/wiqayati-citoyen/builds"
          echo "Le lien de telechargement APK sera disponible une fois le build termine."
