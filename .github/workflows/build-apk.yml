name: Build Android APK (Gradle Local)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

  push:
    branches:
      - main
    paths:
      - 'mobile/**'

jobs:
  build-apk:
    name: Build APK with Gradle (no EAS queue)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Create .env with API URL
        working-directory: mobile
        run: echo "EXPO_PUBLIC_API_URL=https://wiqayati.onrender.com" > .env

      - name: Generate native Android project (expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Debug APK with Gradle
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK with Gradle
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Find APK file
        id: find_apk
        run: |
          APK=$(find mobile/android -name "*.apk" -not -path "*/test*" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK found: $APK"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiqayati-citoyen-${{ github.event.inputs.build_type || 'debug' }}.apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Build complete
        run: |
          echo "✅ APK généré avec succès !"
          echo "Téléchargez-le depuis l'onglet 'Artifacts' de ce workflow GitHub Actions."
